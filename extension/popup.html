<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity AI Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 290px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #fafafa;
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 10px;
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .subtitle {
      font-size: 11px;
      color: #a1a1aa;
    }
    .card {
      background: #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-label {
      font-weight: 600;
      font-size: 12px;
      color: #d4d4d8;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-standby { background: #3f3f46; color: #e4e4e7; }
    .badge-connected { background: #065f46; color: #34d399; }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .provider-tag {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #71717a;
      margin-bottom: 8px;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px;
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .link-btn:hover {
      background: #3f3f46;
      border-color: #52525b;
      color: #fff;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #71717a;
      border-top: 1px solid #27272a;
      padding-top: 8px;
    }
    .footer a {
      color: #a1a1aa;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo">
    <div>
      <div class="title">Antigravity AI Bridge</div>
      <div class="subtitle">Universal Web AI Architect</div>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span class="status-label">Active Tab</span>
      <span id="tab-status" class="badge badge-standby">
        <span class="badge-dot"></span>
        <span id="tab-status-text">Detecting...</span>
      </span>
    </div>
    <div id="tab-provider" class="provider-tag">Checking current page...</div>
  </div>

  <div class="section-title">Open Supported AI Tabs</div>
  <div class="links-grid">
    <a href="https://gemini.google.com" target="_blank" class="link-btn">Gemini</a>
    <a href="https://aistudio.google.com" target="_blank" class="link-btn">AI Studio</a>
    <a href="https://claude.ai" target="_blank" class="link-btn">Claude</a>
    <a href="https://chatgpt.com" target="_blank" class="link-btn">ChatGPT</a>
    <a href="https://chat.deepseek.com" target="_blank" class="link-btn" style="grid-column: span 2;">DeepSeek</a>
  </div>

  <div class="footer">
    Powered by <b>Trignod.ai</b> · <a href="https://github.com/Eyad-Eladawy/antigravity-universal-ai-bridge" target="_blank">GitHub</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
